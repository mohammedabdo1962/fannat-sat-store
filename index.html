<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فنان سات | أطباق الدش والستلايت</title>
  <meta name="description" content="فنان سات | بيع وتركيب أطباق الدش والستلايت مع خدمات الكاميرات والأنظمة" />
  <style>
    :root {
      --red: #d90f1e;
      --red-deep: #b00015;
      --yellow: #f8d000;
      --yellow-deep: #edc100;
      --black: #111;
      --white: #fff;
      --muted: #f7f4ea;
      --gray: #2f2f2f;
      --shadow: rgba(0,0,0,0.2);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Tahoma", "Segoe UI", sans-serif;
      background: #f7f7f7;
      color: var(--black);
      line-height: 1.7;
    }

    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; display: block; }
    button, input, textarea { font: inherit; }

    .container {
      width: min(1180px, calc(100% - 30px));
      margin: 0 auto;
    }

    .header-banner {
      background: linear-gradient(135deg, var(--red) 0%, var(--red) 50%, var(--yellow) 50%, var(--yellow) 100%);
      min-height: 100vh;
      padding: 30px 0 40px;
      display: flex; align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .header-banner::before,
    .header-banner::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.04);
      transform: rotate(45deg);
    }

    .header-banner::before {
      width: 360px; height: 360px;
      top: -120px; right: -120px;
    }

    .header-banner::after {
      width: 360px; height: 360px;
      bottom: -130px; left: -120px;
    }

    .poster {
      width: min(1200px, 100%);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      border-radius: 0;
      position: relative;
      z-index: 1;
      padding: 12px 0;
    }

    .poster-inner {
      background: linear-gradient(180deg, #f7d205, #f6d210);
      border-radius: 16px;
      box-shadow: 0 25px 45px var(--shadow);
      padding: 16px 14px 8px;
      border: 3px solid rgba(0,0,0,0.06);
      position: relative;
    }

    .title-wrap {
      display: flex; align-items: center; justify-content: center; gap: 18px;
      flex-wrap: wrap;
      padding: 10px 0 6px;
    }

    .title-wrap .cam {
      width: 180px; height: 120px; position: relative;
      filter: drop-shadow(0 12px 18px rgba(0,0,0,0.18));
    }

    .cam .body {
      position: absolute; inset: 10px 18px 20px 18px; background: linear-gradient(180deg, #e1e1e1, #b7b7b7);
      border-radius: 26px 26px 30px 30px;
      border: 4px solid #8c8c8c;
      box-shadow: inset 0 0 16px rgba(255,255,255,0.7);
    }

    .cam .lens {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -52%);
      width: 96px; height: 96px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #b8b7b7, #5d5d5d 42%, #121212 60%, #1d1d1d 100%);
      border: 8px solid rgba(255,255,255,0.7);
      box-shadow: inset 0 0 0 14px rgba(0,0,0,0.4);
    }

    .cam .mount {
      position: absolute; width: 20px; height: 36px; background: #d9d9d9; border-radius: 8px; left: 50%; top: 0; transform: translateX(-50%);
    }

    .cam .stand {
      position: absolute; width: 80px; height: 26px; background: #cfcfcf; border-radius: 8px; left: 50%; transform: translateX(-50%); bottom: 0;
    }

    .title-wrap .brand {
      position: relative;
      display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
      font-weight: 900;
      font-size: clamp(2.5rem, 5vw, 7rem);
      line-height: 0.85;
      color: #0a0a0a;
      text-shadow: 2px 2px 0 rgba(255,255,255,0.2);
    }

    .brand span { display: block; }
    .brand .second { margin-right: 14px; }

    .title-wrap .antenna {
      width: 120px; height: 130px; position: relative;
      filter: drop-shadow(0 10px 8px rgba(0,0,0,0.15));
    }

    .antenna .rod {
      position: absolute; width: 10px; height: 84px; background: #101010; border-radius: 999px; left: 50%; top: 18px; transform: translateX(-50%);
    }
    .antenna .disc {
      position: absolute; width: 72px; height: 72px; border-radius: 50%; border: 8px solid #1a1a1a; left: 50%; top: 68px; transform: translateX(-50%);
      background: rgba(255,255,255,0.15);
    }
    .antenna .line {
      position: absolute; width: 100%; height: 12px; border-radius: 999px; background: #111; left: 0; top: 40px;
      transform: rotate(16deg);
    }

    .product-strip {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 14px;
      align-items: center;
      margin-top: 12px;
    }

    .tv-block {
      height: 250px;
      background: linear-gradient(135deg, #d20d1f 0%, #aa0213 100%);
      border-radius: 18px 18px 0 0;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 0 6px rgba(255,255,255,0.08);
    }

    .tv-block .screen {
      position: absolute; inset: 18px 26px 28px 26px; border-radius: 16px; background: linear-gradient(145deg, #0d0d0d, #282828);
      box-shadow: inset 0 0 25px rgba(255,255,255,0.06);
      overflow: hidden;
    }

    .tv-block .screen::before {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0.10), transparent 20%, transparent 80%, rgba(255,255,255,0.10));
    }

    .tv-block .screen .app-grid {
      position: absolute; inset: 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    }

    .tv-block .screen .app-grid span {
      display: block; background: linear-gradient(180deg, #1a7af9, #123d8c); border-radius: 10px;
      box-shadow: inset 0 0 12px rgba(255,255,255,0.25);
    }

    .tv-block .screen .app-grid span:nth-child(2n) { background: linear-gradient(180deg, #1cc45d, #0a8f43); }
    .tv-block .screen .app-grid span:nth-child(3n) { background: linear-gradient(180deg, #ffb100, #d77e00); }
    .tv-block .screen .app-grid span:nth-child(4n) { background: linear-gradient(180deg, #e9467c, #a11452); }

    .tv-block .stand {
      position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
      width: 58%; height: 16px; background: #0d0d0d; border-radius: 8px; opacity: .85;
    }

    .sat-box {
      display: flex; justify-content: center; align-items: center;
      height: 250px; background: rgba(255,255,255,0.04); position: relative;
    }

    .sat-box .dish {
      position: relative; width: 140px; height: 140px; border-radius: 50%; background: linear-gradient(180deg, #d8d8d8, #9b9b9b);
      box-shadow: inset 0 0 0 12px rgba(255,255,255,0.7), inset 0 0 0 24px rgba(0,0,0,0.12);
      border: 4px solid rgba(0,0,0,0.15);
    }

    .sat-box .dish::before {
      content: ""; position: absolute; inset: 18px; border-radius: 50%; background: linear-gradient(180deg, #a1a1a1, #dedede);
    }

    .sat-box .dish::after {
      content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 14px; height: 100%; border-left: 6px solid rgba(0,0,0,0.2); border-right: 6px solid rgba(0,0,0,0.2);
      border-radius: 999px;
    }

    .sat-box .arm {
      position: absolute; width: 120px; height: 12px; background: #111; border-radius: 999px; left: 50%; bottom: 30px; transform: translateX(-50%) rotate(12deg);
      box-shadow: 0 0 0 6px rgba(255,255,255,0.06);
    }

    .set-top-box {
      display: flex; align-items: center; justify-content: center; height: 250px; background: rgba(255,255,255,0.04); position: relative;
    }

    .set-top-box .device {
      width: 180px; height: 180px; border-radius: 28px; background: linear-gradient(180deg, #d8d8d8, #b7b7b7); position: relative; box-shadow: inset 0 0 18px rgba(255,255,255,0.5);
    }

    .set-top-box .device::before {
      content: ""; position: absolute; inset: 18px 18px 48px 18px; border-radius: 14px; background: linear-gradient(180deg, #2a2a2a, #121212);
      box-shadow: inset 0 0 16px rgba(255,255,255,0.08);
    }

    .set-top-box .device::after {
      content: ""; position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: 70%; height: 20px; background: #111; border-radius: 10px;
    }

    .bottom-strip {
      display: grid;
      grid-template-columns: 1fr 1.1fr 1fr;
      gap: 18px;
      align-items: center;
      margin-top: 20px;
      padding: 6px 8px 12px;
    }

    .info-line {
      font-size: clamp(1.15rem, 2vw, 2.4rem);
      font-weight: 900;
      color: #0d0d0d;
      text-align: center;
      line-height: 1.2;
      word-break: break-word;
    }

    .info-line strong { display: block; }

    .phones {
      display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 12px;
      font-weight: 900; font-size: clamp(1.2rem, 2vw, 2rem);
      color: var(--black);
      text-align: center;
    }

    .phones a {
      color: #0d0d0d;
      background: rgba(255,255,255,0.22);
      border-radius: 999px;
      padding: 8px 14px;
      border: 2px solid rgba(0,0,0,0.08);
      transition: transform 0.2s ease;
    }

    .phones a:hover { transform: translateY(-2px); }

    .small-tag {
      display: inline-block;
      background: rgba(0,0,0,0.08);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #0d0d0d;
    }

    .red-strip {
      background: var(--red);
      color: var(--white);
      font-size: clamp(1.4rem, 2vw, 2.5rem);
      font-weight: 900;
      text-align: center;
      padding: 18px 12px 20px;
      margin-top: 18px;
      border-radius: 12px 12px 0 0;
      box-shadow: 0 -10px 20px rgba(0,0,0,0.08);
    }

    @media (max-width: 980px) {
      .product-strip { grid-template-columns: 1fr; }
      .bottom-strip { grid-template-columns: 1fr; }
      .title-wrap { gap: 10px; }
      .title-wrap .cam, .title-wrap .antenna { transform: scale(0.9); }
    }

    @media (max-width: 680px) {
      .header-banner { min-height: auto; padding: 20px 0 26px; }
      .poster-inner { padding: 16px 10px; }
      .title-wrap { gap: 8px; }
      .title-wrap .cam { width: 120px; height: 90px; }
      .title-wrap .antenna { width: 90px; height: 90px; }
      .info-line { font-size: 1.35rem; }
      .phones { font-size: 1.1rem; }
      .red-strip { font-size: 1.25rem; }
    }
  </style>
</head>

  </header>
